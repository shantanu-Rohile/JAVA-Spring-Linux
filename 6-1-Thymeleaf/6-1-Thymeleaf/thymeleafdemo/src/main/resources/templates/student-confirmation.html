<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student-Confirmation</title>
</head>
<body>
Student Confirmation : <span th:text="${Student.firstName + ' ' + Student.lastName}"></span>
Country : <span th:text="${Student.country}"></span>
Language  : <span th:text = "${Student.language}" ></span>
</body>
</html>
