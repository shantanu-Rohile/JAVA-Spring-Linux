<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Employee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h3>Add Employee</h3>
    <hr>

    <form th:action="@{/employee/save}"
          th:object="${employees}"
          method="POST">


        <input type="hidden"
               th:field="*{id}">

        <input type="text"
               th:field="*{firstName}"
               class="form-control mb-3 w-25"
               placeholder="First Name">

        <input type="text"
               th:field="*{lastName}"
               class="form-control mb-3 w-25"
               placeholder="Last Name">

        <input type="email"
               th:field="*{email}"
               class="form-control mb-3 w-25"
               placeholder="Email">

        <button type="submit"
                class="btn btn-info col-2">
            Save
        </button>

        <br>
        <br>

        <a th:href="@{/employee/list}">Back to the employee list</a>

    </form>

</div>

</body>
</html>
